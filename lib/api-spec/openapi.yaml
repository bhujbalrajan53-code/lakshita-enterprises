openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inspection-requests:
    post:
      operationId: createInspectionRequest
      tags: [inspection-requests]
      summary: Create an inspection request
      description: Stores a new waterproofing inspection lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionRequestInput"
      responses:
        "201":
          description: Inspection request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionRequest"
        "400":
          description: Invalid inspection request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InspectionRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 7
        service:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
        - name
        - phone
        - service
        - message
    InspectionRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        service:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - service
        - message
        - createdAt

