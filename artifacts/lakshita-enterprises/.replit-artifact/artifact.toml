kind = "web"
previewPath = "/"
title = "Lakshita Enterprises"
description = "A premium, responsive website for Lakshita Enterprises, a waterproofing business helping homeowners, builders, and property managers protect their spaces with dependable waterproofing solutions."
version = "1.0.0"
id = "artifacts/lakshita-enterprises"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21424

[services.development]
run = "pnpm --filter @workspace/lakshita-enterprises run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lakshita-enterprises", "run", "build" ]
serve = "static"
publicDir = "artifacts/lakshita-enterprises/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21424"
BASE_PATH = "/"
